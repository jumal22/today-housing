(function(){

<style>
  :root{
    --paper:#FAF7F1;
    --paper-raised:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#5B6169;
    --blueprint:#C4703F;
    --blueprint-deep:#8F4A22;
    --blueprint-soft:#F6E6DA;
    --terra:#C4703F;
    --terra-soft:#F3E3D6;
    --line:#DAD3C3;
    --shadow:rgba(35,38,43,.10);
    --focus:#C4703F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14181D;
      --paper-raised:#1B2027;
      --ink:#ECE8DF;
      --ink-soft:#A9AFB8;
      --blueprint:#75ACDB;
      --blueprint-deep:#A7CFEF;
      --blueprint-soft:#20303F;
      --terra:#E5936A;
      --terra-soft:#3A2A22;
      --line:#2B3138;
      --shadow:rgba(0,0,0,.45);
      --focus:#75ACDB;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181D;
    --paper-raised:#1B2027;
    --ink:#ECE8DF;
    --ink-soft:#A9AFB8;
    --blueprint:#75ACDB;
    --blueprint-deep:#A7CFEF;
    --blueprint-soft:#20303F;
    --terra:#E5936A;
    --terra-soft:#3A2A22;
    --line:#2B3138;
    --shadow:rgba(0,0,0,.45);
    --focus:#75ACDB;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    /* plan3d.html과 동일한 이유로 추가 — 한글 줄바꿈이 음절 아무데서나 일어나지 않고 스페이스
       기준으로만 자연스럽게 되도록 함. */
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,h2,h3{
    font-family:'Do Hyeon','Apple SD Gothic Neo',sans-serif;
    font-weight:400;
    color:var(--ink);
    text-wrap:balance;
    margin:0;
  }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:none; margin:0; padding:0 clamp(20px,4vw,64px);}
  section{padding:clamp(40px,6vw,72px) 0;}

  /* ---------- header ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:none; margin:0; padding:14px clamp(20px,4vw,64px);
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .logo{
    font-family:'Do Hyeon',sans-serif; font-size:1.3rem; letter-spacing:.02em;
    color:var(--blueprint-deep); display:flex; align-items:center; gap:8px; text-decoration:none;
  }
  .logo svg{flex:none;}
  .nav-links{display:flex; gap:28px; list-style:none; margin:0; padding:0;}
  .nav-links a{
    font-size:.92rem; color:var(--ink-soft); text-decoration:none;
    border-bottom:1px solid transparent; padding-bottom:2px;
  }
  .nav-links a:hover{color:var(--ink); border-color:var(--line);}
  .nav-links a.is-active{color:var(--ink); border-color:var(--blueprint);}
  @media (max-width:720px){ .nav-links{display:none;} }

  .theme-toggle{
    appearance:none; cursor:pointer; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .theme-toggle:hover{color:var(--ink); border-color:var(--ink-soft);}
  .theme-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .nav-right{display:flex; align-items:center; gap:12px;}

  /* ---------- 로그인 드롭다운 ---------- */
  .nav-auth{position:relative;}
  .login-dropdown{
    position:absolute; top:calc(100% + 12px); right:0; z-index:60; width:430px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 14px 36px -14px var(--shadow); padding:28px;
  }
  @media (max-width:500px){ .login-dropdown{width:calc(100vw - 40px);} }
  /* 열고 닫을 때 다른 팝업들처럼 오른쪽 위(로그인 버튼)에서 뿅 튀어나왔다가 쏙 들어가는 효과.
     display:none 토글은 애니메이션이 안 먹으니 opacity/visibility/transform으로 처리 */
  .login-dropdown{
    transform-origin:top right; opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-8px) scale(.9);
    transition:opacity .16s ease, transform .18s ease, visibility 0s linear .18s;
  }
  .login-dropdown.open{
    opacity:1; visibility:visible; pointer-events:auto; transform:none;
    transition:opacity .18s ease, transform .38s cubic-bezier(.34,1.56,.64,1), visibility 0s;
  }
  @media (prefers-reduced-motion:reduce){
    .login-dropdown, .login-dropdown.open{ transform:none; transition:opacity .12s linear, visibility 0s linear .12s; }
    .login-dropdown.open{ transition:opacity .12s linear, visibility 0s; }
  }
  .login-field{display:block; margin-bottom:16px;}
  .login-field span{display:block; font-size:.85rem; color:var(--ink-soft); margin-bottom:7px;}
  .login-field input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:1rem;
  }
  .login-field input:focus-visible{outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus);}
  .login-submit{width:100%; justify-content:center; margin-top:6px; padding:13px 20px; font-size:1rem;}
  .login-links{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-top:20px;
    padding-top:18px; border-top:1px solid var(--line);
    font-size:.86rem; color:var(--ink-soft);
  }
  .login-links a{color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px;}
  .login-links a:hover{color:var(--ink);}

  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:10px;
    font-size:.95rem; font-weight:600; padding:12px 20px;
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .btn-primary{background:var(--blueprint); color:#fff; box-shadow:0 1px 2px var(--shadow);}
  .btn-primary:hover{background:var(--blueprint-deep); transform:translateY(-1px);}
  .btn-sm{padding:9px 14px; font-size:.85rem; border-radius:8px;}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:.8rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--blueprint); border-bottom:1px dashed var(--blueprint);
    padding-bottom:4px; margin-bottom:18px;
  }

  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:.86rem; color:var(--ink-soft);
    text-decoration:none; margin-bottom:22px;
  }
  .back-link:hover{color:var(--ink);}

  /* ---------- gallery(게시판) ---------- */
  .gallery-page-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .gallery-page-head h1{font-size:clamp(1.8rem,3.4vw,2.4rem); margin-bottom:10px;}
  .gallery-page-head p{color:var(--ink-soft); font-size:1.02rem; max-width:56ch;}
  .gallery-page-head .btn{flex:none;}

  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin:28px 0 24px;}
  .filter-chip{
    appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink-soft); border-radius:100px; padding:7px 16px; font-size:.85rem; font-weight:600;
  }
  .filter-chip:hover{color:var(--ink); border-color:var(--ink-soft);}
  .filter-chip.is-active{background:var(--blueprint); color:#fff; border-color:var(--blueprint);}
  .filter-chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .badge{
    font-size:.72rem; font-weight:600; background:var(--terra-soft); color:var(--terra);
    padding:3px 9px; border-radius:100px; white-space:nowrap;
  }

  .gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:960px){ .gallery-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:620px){ .gallery-grid{grid-template-columns:1fr;} }

  .gallery-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .15s ease, transform .15s ease;
  }
  .gallery-card:hover{border-color:var(--blueprint); transform:translateY(-2px);}

  .gallery-thumb{
    position:relative; aspect-ratio:4/3;
    background:linear-gradient(155deg, var(--blueprint-soft), var(--paper) 78%);
    display:flex; align-items:center; justify-content:center; color:var(--blueprint);
  }
  .gallery-thumb[data-variant="2"]{background:linear-gradient(155deg, var(--terra-soft), var(--paper) 78%); color:var(--terra);}
  .gallery-thumb[data-variant="3"]{background:linear-gradient(155deg, var(--blueprint-soft) 0%, var(--terra-soft) 130%); color:var(--blueprint-deep);}
  .gallery-badge{position:absolute; top:10px; right:10px;}
  /* 실제 게시물은 3D 화면을 캡처한 썸네일(<img>)을 가짐 — 그래디언트 placeholder 대신 사진을 꽉 채움 */
  .gallery-thumb.has-image{background:var(--paper-raised);}
  .gallery-thumb.has-image img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .gallery-thumb-link{display:block; color:inherit;}

  .gallery-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .gallery-body h3{font-size:.96rem; font-family:'IBM Plex Sans KR'; font-weight:700; line-height:1.4;}
  .gallery-body h3 a{color:inherit; text-decoration:none;}
  .gallery-body h3 a:hover{text-decoration:underline;}
  .gallery-user{font-size:.8rem; color:var(--ink-soft);}
  .gallery-stats{display:flex; gap:14px; margin-top:auto; padding-top:10px; font-size:.82rem; color:var(--ink-soft);}
  .gallery-stats span{display:inline-flex; align-items:center; gap:5px;}
  .gallery-stats svg{flex:none;}

  .empty-msg{color:var(--ink-soft); font-size:.9rem; padding:32px 0; text-align:center;}
  .gallery-note{margin-top:22px; font-size:.82rem; color:var(--ink-soft);}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line); padding:32px 0;}
  .footer-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  footer .logo{font-size:1rem;}
  footer p{color:var(--ink-soft); font-size:.82rem;}
  .credits-link{color:var(--ink-soft); font-size:.82rem; text-decoration:underline; text-underline-offset:2px;}
  .credits-link:hover{color:var(--ink);}
  .credits-link:focus-visible{outline:2px solid var(--focus,#C4703F); outline-offset:2px; border-radius:3px;}
  /* ---------- 다크/라이트 전환 애니메이션 ---------- */
  /* 지원하는 브라우저(View Transitions): 테마 버튼 자리에서 새 테마가 원으로 퍼져나감(JS가 clip-path를 움직임) */
  ::view-transition-old(root), ::view-transition-new(root){ animation:none; mix-blend-mode:normal; }
  ::view-transition-old(root){ z-index:1; }
  ::view-transition-new(root){ z-index:2; }
  /* 지원 안 하는 브라우저: 전환하는 0.4초 동안만 색이 서서히 바뀌게 함 */
  html.theme-fade, html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after{
    transition:background-color .55s ease, color .55s ease, border-color .55s ease, fill .55s ease, stroke .55s ease, box-shadow .55s ease !important;
  }

  /* ---------- 서버 연동용 추가 스타일 ---------- */
  .btn-ghost{background:var(--paper); color:var(--ink); border:1.5px solid var(--line); box-shadow:none;}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .gallery-thumb.has-plan{background:linear-gradient(155deg, var(--blueprint-soft), var(--paper) 78%); padding:12px;}
  .gallery-thumb.has-plan svg{position:relative;}
  .gallery-user{display:flex; align-items:center; flex-wrap:wrap; gap:0 6px;}
  .gallery-user .dot{color:var(--ink-soft);}
  .ip-tag{font-size:.74rem; color:var(--ink-soft);}
  .role-tag{flex:none; font-size:.68rem; font-weight:600; line-height:1.5; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper);}
  .role-tag.pro{color:#3C7A5B; background:color-mix(in srgb, #3C7A5B 13%, var(--paper-raised)); border-color:color-mix(in srgb, #3C7A5B 38%, transparent);}
  :root[data-theme="dark"] .role-tag.pro{color:#7BC79E; background:color-mix(in srgb, #7BC79E 14%, var(--paper-raised)); border-color:color-mix(in srgb, #7BC79E 38%, transparent);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .role-tag.pro{color:#7BC79E; background:color-mix(in srgb, #7BC79E 14%, var(--paper-raised)); border-color:color-mix(in srgb, #7BC79E 38%, transparent);} }
  .gallery-stats{align-items:center;}
  .card-del{margin-left:auto; appearance:none; border:0; background:none; cursor:pointer; font:inherit; font-size:.8rem; color:var(--ink-soft); padding:2px 4px; text-decoration:underline; text-underline-offset:2px;}
  .card-del:hover{color:#B3392F;}
  .card-del:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  /* 삭제 확인 작은 창 (누른 버튼 바로 밑) */
  .oh-pop{position:absolute; z-index:1500; box-sizing:border-box; padding:18px 18px 16px; background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 36px -14px var(--shadow); opacity:0; transform:translateY(-6px) scale(.96); transition:opacity .14s ease, transform .16s ease;}
  .oh-pop.open{opacity:1; transform:none;}
  .oh-pop-title{font-size:.95rem; margin:0 0 6px; color:var(--ink);}
  .oh-pop-text{margin:0 0 12px; font-size:.86rem; line-height:1.55; color:var(--ink-soft);}
  .oh-pop-input{width:100%; box-sizing:border-box; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:.92rem;}
  .oh-pop-input:focus-visible{outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus);}
  .oh-pop-err{margin:7px 0 0; font-size:.8rem; line-height:1.4; color:#B3392F;}
  .oh-pop-err:empty{display:none;}
  .oh-pop-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
  @media (prefers-reduced-motion:reduce){ .oh-pop{transition:none;} }
</style>

<script>
(function(){
  "use strict";
  /* ============ 갤러리 — 글은 Supabase(DB)에서 가져온다 ============
     목록은 누구나(비회원 포함) 볼 수 있고, 삭제 버튼은 내 글(비회원 임시 세션으로 쓴 글 포함)이거나
     내가 관리자일 때만 보인다. 진짜 권한 검사는 서버(DB 규칙)가 하고, 버튼은 편의일 뿐이다. */
  var OH_COMMENT_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 01-8.5 8.5 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1116.1-3.8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  var OH_LIKE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C.8 8 2.2 4.5 5.8 4.5c2 0 3.4 1.1 4.2 2.4.8-1.3 2.2-2.4 4.2-2.4 3.6 0 5 3.5 3.3 7C19 15.65 12 20 12 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  var OH_FURN_FILL = { sofa:"#c98f72", table:"#9a704d", bed:"#90a8bb", plant:"#5c8d61", door:"#8a5a34", window:"#9cc7d8", outlet:"#d8d3c6" };

  function ohTimeAgo(iso){
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff/60000);
    if (min < 1) return "방금 전";
    if (min < 60) return min + "분 전";
    var hr = Math.floor(min/60);
    if (hr < 24) return hr + "시간 전";
    var day = Math.floor(hr/24);
    if (day < 7) return day + "일 전";
    return new Date(iso).toLocaleDateString((window.OH_I18N && OH_I18N.lang === "en") ? "en-US" : "ko-KR");
  }
  function ohEscapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  var POSTS = [];                 // 서버에서 가져온 글
  var EXPERT_COUNT = {};          // 글 id → 인테리어 업자가 남긴 댓글 수
  var CURRENT_FILTER = "all";
  var FILTER_ORDER = ["all", "expert", "recent", "popular"]; // .filter-bar 안의 칩 순서와 동일
  var sb = null;

  function authorOf(p){
    var prof = p.profiles || {};
    var guest = !!p.author_name;
    return { name: guest ? p.author_name : (prof.nickname || "회원"), guest: guest, role: guest ? "user" : (prof.role || "user"), ip: guest ? (p.ip_prefix || "") : "" };
  }
  function imageUrl(path){
    if (!path || !sb) return "";
    return sb.storage.from("post-images").getPublicUrl(path).data.publicUrl;
  }
  /* 사진 없이도 배치가 보이게: 벽 좌표와 가구로 위에서 본 도면을 그린다(비회원 글은 이미지를 못 올리니 항상 이 방식) */
  function topViewSvg(p){
    var wd = p.wall_data || {};
    var segs = (wd.outer || []).concat(wd.inner || []);
    var w = Number(p.room_w) || wd.width || 0, d = Number(p.room_d) || wd.depth || 0;
    segs.forEach(function(s){ w = Math.max(w, s[0], s[2]); d = Math.max(d, s[1], s[3]); });
    if (!w || !d) return "";
    var m = Math.max(w, d) * 0.08 + 0.3;
    var sw = Math.max(w, d) * 0.028;
    var out = '<svg viewBox="' + (-m) + ' ' + (-m) + ' ' + (w + 2*m) + ' ' + (d + 2*m) + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="위에서 본 배치도" style="width:100%;height:100%;display:block;">';
    out += '<rect x="0" y="0" width="' + w + '" height="' + d + '" fill="var(--paper-raised)" opacity=".7"/>';
    (p.furniture || []).forEach(function(f){
      var fw = f.w || 0.6, fd = f.d || 0.6;
      var fill = typeof f.color === "string" && /^#[0-9a-f]{3,8}$/i.test(f.color) ? f.color : (typeof f.color === "number" ? "#" + ("000000" + f.color.toString(16)).slice(-6) : (OH_FURN_FILL[f.type] || "#b9b4a8"));
      out += '<rect x="' + (-fw/2) + '" y="' + (-fd/2) + '" width="' + fw + '" height="' + fd + '" rx="' + Math.min(fw, fd) * 0.12 + '" fill="' + fill + '" stroke="rgba(0,0,0,.25)" stroke-width="' + sw * 0.25 + '" transform="translate(' + (f.x || 0) + ' ' + (f.z || 0) + ') rotate(' + (-(f.rotY || 0) * 180 / Math.PI) + ')"/>';
    });
    segs.forEach(function(s){
      out += '<line x1="' + s[0] + '" y1="' + s[1] + '" x2="' + s[2] + '" y2="' + s[3] + '" stroke="var(--blueprint-deep)" stroke-width="' + sw + '" stroke-linecap="square"/>';
    });
    return out + '</svg>';
  }

  var me = { uid: null, admin: false };
  function refreshMe(){
    var su = window.OHAuth && OHAuth.getSessionUser && OHAuth.getSessionUser();
    me.uid = su ? su.id : null;
    me.admin = !!(window.OHAuth && OHAuth.isAdmin && OHAuth.isAdmin());
  }
  function canDelete(p){ return !!p.author_name || (!!me.uid && (me.admin || p.user_id === me.uid)); }   /* 비회원 글은 비밀번호로 누구나 지우기 시도 */

  function ohMatchesFilter(p, filter){
    if (filter === "expert") return (EXPERT_COUNT[p.id] || 0) > 0;
    return true;
  }
  function ohSortPosts(posts, filter){
    var arr = posts.slice();
    if (filter === "popular") arr.sort(function(a, b){ return (b.like_count || 0) - (a.like_count || 0) || (new Date(b.created_at) - new Date(a.created_at)); });
    else arr.sort(function(a, b){ return new Date(b.created_at) - new Date(a.created_at); });
    return arr;
  }
  function ohRenderCard(p){
    var url = imageUrl(p.thumb_path);
    var inner = url ? '<img src="' + ohEscapeHtml(url) + '" alt="" loading="lazy">' : topViewSvg(p);
    var hasImg = !!url;
    var ex = EXPERT_COUNT[p.id] || 0;
    var badge = ex ? '<span class="badge gallery-badge">전문가 답변 ' + ex + '</span>' : "";
    var a = authorOf(p);
    var tag = a.role === "contractor" ? '<span class="role-tag pro">인테리어 업자</span>' : (a.guest ? '<span class="role-tag guest">비회원</span>' + (a.ip ? '<span class="ip-tag">(' + ohEscapeHtml(a.ip) + ')</span>' : "") : "");
    var href = "/post?id=" + encodeURIComponent(p.id);
    var del = canDelete(p) ? '<button type="button" class="card-del" data-del="' + ohEscapeHtml(p.id) + '" aria-label="' + ohEscapeHtml(p.title) + ' 삭제">삭제</button>' : "";
    return '' +
      '<article class="gallery-card">' +
        '<a class="gallery-thumb-link" href="' + href + '" aria-label="' + ohEscapeHtml(p.title) + ' 상세보기">' +
          '<div class="gallery-thumb' + (hasImg ? ' has-image' : ' has-plan') + '" data-variant="1">' + inner + badge + '</div>' +
        '</a>' +
        '<div class="gallery-body">' +
          '<h3 data-i18n-skip><a href="' + href + '">' + ohEscapeHtml(p.title) + '</a></h3>' +
          '<p class="gallery-user"><span class="gallery-name" data-i18n-skip>' + ohEscapeHtml(a.name) + '</span>' + tag + '<span class="dot">·</span>' + ohTimeAgo(p.created_at) + '</p>' +
          '<div class="gallery-stats">' +
            '<span>' + OH_COMMENT_ICON + ' ' + (p.comment_count || 0) + '</span>' +
            '<span>' + OH_LIKE_ICON + ' ' + (p.like_count || 0) + '</span>' + del +
          '</div>' +
        '</div>' +
      '</article>';
  }
  function setGridMessage(html){
    var grid = document.getElementById("galleryGrid");
    if (grid) grid.innerHTML = '<p class="empty-msg" style="grid-column:1/-1;">' + html + '</p>';
  }
  function ohRenderGrid(){
    var grid = document.getElementById("galleryGrid");
    if (!grid) return;
    refreshMe();
    var posts = POSTS.filter(function(p){ return ohMatchesFilter(p, CURRENT_FILTER); });
    posts = ohSortPosts(posts, CURRENT_FILTER);
    if (!posts.length){
      setGridMessage(POSTS.length ? "해당하는 게시물이 아직 없어요." : "아직 올라온 배치가 없어요. 첫 배치를 올려보세요!");
      return;
    }
    grid.innerHTML = posts.map(ohRenderCard).join("");
  }

  function loadPosts(){
    if (!sb){ setGridMessage("서버에 연결하지 못했어요. 새로고침해 보세요."); return; }
    setGridMessage("불러오는 중…");
    var q1 = sb.from("posts")
      .select("id, user_id, author_name, ip_prefix, title, room_w, room_d, wall_data, furniture, thumb_path, like_count, comment_count, created_at, profiles(nickname, role)")
      .order("created_at", { ascending: false }).limit(60);
    var q2 = sb.from("comments").select("post_id, profiles!inner(role)").eq("profiles.role", "contractor").limit(1000);
    Promise.all([q1, q2]).then(function(rs){
      if (rs[0].error){ console.error(rs[0].error); setGridMessage("게시물을 불러오지 못했어요. 잠시 뒤에 다시 시도해 주세요."); return; }
      POSTS = rs[0].data || [];
      EXPERT_COUNT = {};
      ((rs[1] && rs[1].data) || []).forEach(function(c){ EXPERT_COUNT[c.post_id] = (EXPERT_COUNT[c.post_id] || 0) + 1; });
      ohRenderGrid();
    }, function(){ setGridMessage("네트워크를 확인하고 다시 시도해 주세요."); });
  }

  /* ----- 삭제 확인: 로그인 창처럼 누른 버튼 바로 밑에 작은 창으로 뜬다 -----
     o: { title, text, pw(비밀번호 칸 여부), yesLabel, run(pw) → Promise<null(성공) | 오류 문구> } → Promise<성공 여부> */
  var ohPopEl = null, ohPopClose = null;
  function ohPop(anchor, o){
    if (ohPopClose){
      var same = ohPopEl && ohPopEl._anchor === anchor;
      ohPopClose(false);
      if (same) return Promise.resolve(false);   /* 같은 버튼을 다시 누르면 닫기 */
    }
    return new Promise(function(resolve){
      var pop = document.createElement("div");
      pop.className = "oh-pop";
      pop.setAttribute("role", "dialog");
      pop.setAttribute("aria-label", o.title);
      pop.innerHTML = '<h4 class="oh-pop-title">' + ohEscapeHtml(o.title) + '</h4>' +
        (o.text ? '<p class="oh-pop-text">' + ohEscapeHtml(o.text) + '</p>' : "") +
        (o.pw ? '<input class="oh-pop-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="비밀번호 (숫자 4~6자리)" aria-label="삭제용 비밀번호">' : "") +
        '<p class="oh-pop-err" role="alert"></p>' +
        '<div class="oh-pop-actions"><button type="button" class="btn btn-ghost btn-sm" data-no>취소</button><button type="button" class="btn btn-primary btn-sm" data-yes>' + ohEscapeHtml(o.yesLabel || "삭제하기") + '</button></div>';
      pop._anchor = anchor;
      document.body.appendChild(pop);
      var input = pop.querySelector("input"), err = pop.querySelector(".oh-pop-err"), yes = pop.querySelector("[data-yes]");
      var closed = false, tick = null;

      function place(){
        var r = anchor.getBoundingClientRect();
        var w = Math.min(340, window.innerWidth - 24);
        pop.style.width = w + "px";
        var left = r.left; if (left + w > window.innerWidth - 12) left = r.right - w; left = Math.max(12, Math.min(left, window.innerWidth - w - 12));   /* 버튼 왼쪽에 맞춰 바로 밑에, 넘치면 오른쪽 맞춤 */
        var h = pop.offsetHeight;
        var below = (r.bottom + 10 + h <= window.innerHeight - 8) || (r.top < h + 18);
        var top = below ? r.bottom + 10 : r.top - h - 10;
        pop.style.left = (left + window.scrollX) + "px";
        pop.style.top = (top + window.scrollY) + "px";
        pop.style.transformOrigin = (below ? "top" : "bottom") + " " + Math.max(0, Math.min(w, (r.left + r.right) / 2 - left)) + "px";
      }
      function close(ok){
        if (closed) return;
        closed = true;
        clearInterval(tick);
        document.removeEventListener("mousedown", onOutside, true);
        document.removeEventListener("keydown", onKey, true);
        window.removeEventListener("resize", place);
        if (ohPopEl === pop){ ohPopEl = null; ohPopClose = null; }
        pop.classList.remove("open");
        setTimeout(function(){ pop.remove(); }, 160);
        if (!ok && anchor.isConnected){ try { anchor.focus({ preventScroll: true }); } catch (e) {} }
        resolve(!!ok);
      }
      function onOutside(e){ if (!pop.contains(e.target) && !anchor.contains(e.target)) close(false); }
      function onKey(e){ if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); close(false); } }
      document.addEventListener("mousedown", onOutside, true);
      document.addEventListener("keydown", onKey, true);
      window.addEventListener("resize", place);
      ohPopEl = pop; ohPopClose = close;

      pop.querySelector("[data-no]").addEventListener("click", function(){ close(false); });
      if (input) input.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); yes.click(); } });
      yes.addEventListener("click", function(){
        var pw = "";
        if (o.pw){
          pw = input.value.trim();
          if (!/^[0-9]{4,6}$/.test(pw)){ err.textContent = "숫자 4~6자리 비밀번호를 입력해 주세요."; place(); input.focus(); return; }
        }
        err.textContent = ""; yes.disabled = true;
        var label = yes.textContent; yes.textContent = "삭제하는 중…";
        o.run(pw).then(function(msg){
          if (!msg){ close(true); return; }
          err.textContent = msg; yes.disabled = false; yes.textContent = label; place();
          if (input) input.select();
        });
      });

      place();
      requestAnimationFrame(function(){
        pop.classList.add("open");
        var pr = pop.getBoundingClientRect();
        if (pr.bottom > window.innerHeight || pr.top < 0) pop.scrollIntoView({ block: "nearest", behavior: "smooth" });
        (input || pop.querySelector("[data-no]")).focus({ preventScroll: true });
      });
      /* 글이 다시 그려져서 누른 버튼이 사라지면 창도 닫고, 그 사이 레이아웃이 움직이면 따라간다 */
      tick = setInterval(function(){ if (!anchor.isConnected) close(false); else place(); }, 250);
    });
  }

  /* ---------- 삭제 (누른 버튼 밑에 작은 창 → 글 삭제 → 올렸던 이미지 정리) ---------- */
  function deleteOwnPost(p){
    return sb.from("posts").delete().eq("id", p.id).select("id").then(function(r){
      if (r.error || !r.data || !r.data.length) return r.error ? "삭제하지 못했어요. 잠시 뒤에 다시 시도해 주세요." : "삭제 권한이 없어요.";
      /* 올렸던 이미지(썸네일·도면·벽지)도 정리 — 실패해도 글은 이미 지워졌으니 조용히 넘어간다 */
      var folder = p.user_id + "/" + p.id;
      sb.storage.from("post-images").list(folder).then(function(l){
        var names = ((l && l.data) || []).map(function(f){ return folder + "/" + f.name; });
        if (names.length) return sb.storage.from("post-images").remove(names);
      }).catch(function(){});
      return null;
    }, function(){ return "네트워크가 불안정해서 삭제하지 못했어요."; });
  }
  function deleteGuestPost(p, pw){
    return sb.rpc("delete_guest_item", { p_kind: "post", p_id: p.id, p_pw: pw }).then(function(r){
      if (r.error) return /too_many/.test(r.error.message || "") ? "비밀번호를 너무 많이 틀렸어요. 잠시 뒤에 다시 시도해 주세요." : "삭제하지 못했어요. 잠시 뒤에 다시 시도해 주세요.";
      return r.data ? null : "비밀번호가 맞지 않아요.";
    }, function(){ return "네트워크가 불안정해요."; });
  }
  document.getElementById("galleryGrid").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-del]") : null;
    if (!b) return;
    e.preventDefault();
    var id = b.getAttribute("data-del"), p = null;
    for (var i = 0; i < POSTS.length; i++){ if (POSTS[i].id === id){ p = POSTS[i]; break; } }
    if (!p || !sb) return;
    refreshMe();
    var guestDel = !!p.author_name && !me.admin;
    var mine = p.user_id === me.uid;
    ohPop(b, { title: "이 게시물을 삭제할까요?", pw: guestDel,
      text: '‘' + p.title + '’ ' + (mine ? "" : "(" + authorOf(p).name + "님의 글) ") + '와 댓글·좋아요가 함께 지워지고, 되돌릴 수 없어요.' + (guestDel ? " 글을 올릴 때 정한 숫자 비밀번호를 입력해 주세요." : ""),
      run: function(pw){ return guestDel ? deleteGuestPost(p, pw) : deleteOwnPost(p); } }).then(function(done){
        if (!done) return;
        POSTS = POSTS.filter(function(x){ return x.id !== p.id; });
        ohRenderGrid();
        if (window.OHAuth) OHAuth.toast("게시물을 삭제했어요.");
      });
  });


  /* 다크/라이트 모드 토글 — plan3d.html과 동일한 localStorage 키("oh-theme")를 공유해서
     두 페이지를 오가도 모드가 유지됨 */
  var SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1110.2 4a6.8 6.8 0 009.8 10.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var themeToggle = document.getElementById("themeToggle");
  var mql = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");

  function currentTheme(){
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit === "light" || explicit === "dark") return explicit;
    return (mql && mql.matches) ? "dark" : "light";
  }
  function applyIcon(){
    themeToggle.innerHTML = currentTheme() === "dark" ? SUN_ICON : MOON_ICON;
  }
  function switchTheme(next, fromEl){
    var apply = function(){
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem("oh-theme", next); } catch(e){}
      applyIcon();
    };
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce){ apply(); return; }
    if (document.startViewTransition){
      // 1순위: 버튼 위치에서 원이 퍼져나가며 새 테마로 바뀜
      var rect = fromEl.getBoundingClientRect();
      var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      var endR = Math.hypot(Math.max(cx, window.innerWidth - cx), Math.max(cy, window.innerHeight - cy));
      var vt = document.startViewTransition(apply);
      vt.ready.then(function(){
        document.documentElement.animate(
          { clipPath: ["circle(0px at " + cx + "px " + cy + "px)", "circle(" + endR + "px at " + cx + "px " + cy + "px)"] },
          { duration: 900, easing: "cubic-bezier(.4,.05,.3,1)", pseudoElement: "::view-transition-new(root)" }
        );
      }).catch(function(){});
      return;
    }
    // 2순위: 지원 안 하면 색이 서서히 바뀌는 전환
    var root = document.documentElement;
    root.classList.add("theme-fade");
    apply();
    setTimeout(function(){ root.classList.remove("theme-fade"); }, 700);
  }
  themeToggle.addEventListener("click", function(){
    switchTheme(currentTheme() === "dark" ? "light" : "dark", themeToggle);
  });
  applyIcon();

  /* ---------- 상단 로그인 드롭다운 (백엔드 미연결 — 폼은 자리만 잡아둠) ---------- */
  (function(){
    var loginBtn = document.getElementById("loginBtn");
    var loginDropdown = document.getElementById("loginDropdown");
    var loginForm = document.getElementById("loginForm");
    if (!loginBtn || !loginDropdown) return;

    function isOpen(){ return loginDropdown.classList.contains("open"); }
    function setOpen(open){
      loginDropdown.classList.toggle("open", open);
      loginBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    loginBtn.addEventListener("click", function(e){
      e.stopPropagation();
      setOpen(!isOpen());
    });
    document.addEventListener("click", function(e){
      if (isOpen() && !loginDropdown.contains(e.target) && e.target !== loginBtn){
        setOpen(false);
      }
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && isOpen()) setOpen(false);
    });
    if (loginForm){
      loginForm.addEventListener("submit", function(e){
        e.preventDefault();
        // TODO: 로그인 API 연결 전까지는 제출해도 아무 동작 안 함
      });
    }
  })();

  /* 정렬 칩 — 전체/전문가 답변/최신순/인기순 */
  var filterChips = document.querySelectorAll(".filter-bar .filter-chip");
  filterChips.forEach(function(chip, idx){
    chip.addEventListener("click", function(){
      filterChips.forEach(function(c){ c.classList.remove("is-active"); });
      chip.classList.add("is-active");
      CURRENT_FILTER = FILTER_ORDER[idx] || "all";
      ohRenderGrid();
    });
  });

  /* auth.js 는 이 스크립트 뒤에 불러오므로, 페이지가 다 읽힌 뒤에 시작 */
  function start(){
    if (!window.OHAuth || !OHAuth.configured){ setGridMessage("서버 연결 설정이 아직 없어요."); return; }
    OHAuth.ready().then(function(c){
      sb = c;
      loadPosts();
      /* 로그인/로그아웃·프로필(관리자 여부)이 정해지면 삭제 버튼을 다시 계산 */
      OHAuth.onChange(function(){ if (POSTS.length) ohRenderGrid(); });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
<script src="/auth.js"></script>
